<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>যোগাযোগ | ইস্পাহানি দাখিল মাদ্রাসা - অফিশিয়াল পোর্টাল</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

    <!--CSS Files-->
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/ad.css">
    <link rel="stylesheet" href="assets/css/contact.css">

    <!--JS Files-->
    <script src="assets/js/components.js"></script>
    <script src="assets/js/script.js"></script>
    <script src="assets/js/ad.js"></script>
</head>
<body>
    <div id="navbar-placeholder"></div>
    <!-- Hero -->
    <div class="header-banner">
        <h1>যোগাযোগ করুন</h1>
        <p>যেকোনো তথ্য বা সহায়তার জন্য আমাদের সাথে যোগাযোগ করুন</p>
    </div>

    <div class="container">
        <!-- Info Details -->
        <div class="contact-card">
            <div class="info-item"><i class="fas fa-map-marker-alt"></i><div><h4>ঠিকানা</h4><p>মোহরা, চান্দগাঁও, চট্টগ্রাম</p></div></div>
            <div class="info-item"><i class="fas fa-phone-alt"></i><div><h4>ফোন</h4><p>০১৮৯৪-৮২০৫১৩</p></div></div>
            <div class="info-item"><i class="fas fa-envelope"></i><div><h4>ইমেইল</h4><p>info.idm@gmail.com</p></div></div>
            <hr style="margin-bottom:20px; opacity:0.1;">
            <p style="font-size:14px; text-align:center;">সকাল ৯টা হতে বিকাল ৪টা পর্যন্ত অফিস খোলা থাকে।</p>
        </div>

        <!-- Form -->
        <div class="contact-card">
            <form>
                <label>আপনার নাম</label><input type="text" placeholder="নাম লিখুন">
                <label>ইমেইল</label><input type="email" placeholder="ইমেইল আইডি">
                <label>বিস্তারিত বার্তা</label><textarea rows="5" placeholder="আপনার প্রশ্ন বা মতামত এখানে লিখুন..."></textarea>
                <button type="submit" class="btn-send">বার্তা পাঠান <i class="fas fa-paper-plane"></i></button>
            </form>
        </div>
    </div>
<div id="footer-placeholder"></div>
</body>
</html>
