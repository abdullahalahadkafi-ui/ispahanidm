<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Ispahani Dakhil Madrasah</title>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/portal.css">
  <link rel="stylesheet" href="css/site-shell.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body data-page="login.html">
  <main class="auth-page">
    <section class="auth-card">
      <img class="auth-logo" src="favicon.png" alt="Ispahani Dakhil Madrasah">
      <span class="portal-kicker">Secure portal</span>
      <h1>Sign in to IDM</h1>
      <p>Choose your account type. Teacher accounts are reviewed by the madrasah authority before admin access is enabled.</p>
      <label class="portal-field">Account type
        <select id="accountRole">
          <option value="student">Student</option>
          <option value="guardian">Guardian</option>
          <option value="other">Other</option>
          <option value="teacher">Teacher</option>
        </select>
      </label>
      <button id="googleLogin" class="portal-button auth-google" type="button">Continue with Google</button>
      <p id="loginStatus" class="form-status" role="status"></p>
      <a href="index.html" class="auth-back">Back to public website</a>
    </section>
  </main>
  <script src="JS/site-shell.js"></script>
  <script type="module">
    import { signInWithGoogle, isTeacher } from './JS/auth.js';
    const button = document.getElementById('googleLogin');
    const status = document.getElementById('loginStatus');
    button.addEventListener('click', async () => {
      button.disabled = true;
      status.textContent = 'Connecting to Google...';
      try {
        const role = document.getElementById('accountRole').value;
        const result = await signInWithGoogle(role);
        if (isTeacher(result.profile)) {
          window.location.href = 'ADMIN/index.html';
        } else if (role === 'teacher' || result.profile?.role === 'teacher') {
          status.textContent = 'Your teacher request is waiting for authority approval.';
        } else {
          window.location.href = 'profile.html';
        }
      } catch (error) {
        const messages = {
          'auth/unauthorized-domain': 'This website domain is not authorized in Firebase Authentication. Add localhost and ispahanidm.onrender.com in Firebase Console.',
          'auth/popup-blocked': 'The Google login popup was blocked. Allow popups for this website and try again.',
          'auth/popup-closed-by-user': 'The Google login window was closed before sign-in finished.'
        };
        status.textContent = messages[error.code] || error.message || 'Login could not be completed.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
